[package]
name = "pgm_lib"
version = "0.1.0"
edition = "2024"  # ⬅️ Utilise l'édition 2024 (stable)
description = "Bibliothèque minimaliste pour interfaces terminal (inspirée des principes AS400)"
authors = ["Jean-Pierre Laroche <laroche.jeanpierre@gmail.com>"]
license = "MIT"
repository = "https://github.com/AS400JPLPC/termtui"
keywords = ["tui", "terminal", "RUST", "as400"]
categories = ["command-line-interface"]

[workspace]
resolver = "2"


[features]

TermNV= []

# Ajouter un binaire pour lancer Term.rs
[[bin]]
name = "TermNV"
path = "src/TermNV.rs"  # Fichier pour le binair


[dependencies]
gobject-sys = "0.18.0"
libc = "0.2.189"
once_cell = "1.21.4"
pango = "0.22.8"
pango-sys = "0.22.0"
gtk = { version = "0.18.2", features = ["v3_24"] }
gtk-sys = "0.18.2"
gdk = "0.18.2"
gdk-sys = "0.18.2"
glib = "0.18.5"
glib-sys = "0.18.0"
vte-sys = "0.2.2"
chrono = "0.4.45"

